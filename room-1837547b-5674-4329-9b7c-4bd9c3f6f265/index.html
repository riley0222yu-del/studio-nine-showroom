.slot {
  --hanger-x: var(--side-hanger-x, 0);
  --hanger-y: min(var(--side-hanger-y, 0), var(--front-hanger-y, 0));
  --hanger-width: var(--side-hanger-width, .06);
  /* Leave the hanger above both silhouettes, including during their crossfade. */
  --hanger-depth: 14px;
  --hanger-top: calc(52px + var(--height) * var(--hanger-y) - var(--hanger-depth) - 2px);
  --hook-end: calc(var(--hanger-top) + 1px);
}
.slot.active {
  --hanger-x: var(--front-hanger-x, 0);
  --hanger-width: var(--front-hanger-width, .28);
}
.slot .hook {
  left: calc(50% + var(--height) * var(--hanger-x) - 6px);
  top: -5px;
  height: 14px;
  transition: left .55s var(--ease);
}
.slot .hook::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 7px;
  width: 2px;
  height: var(--hook-end);
  background: linear-gradient(90deg,#b8b0a2,#858076);
  transition: height .55s var(--ease);
}
.slot .hanger, .slot.active .hanger {
  left: calc(50% + var(--height) * var(--hanger-x));
  top: var(--hanger-top);
  width: clamp(12px, var(--height) * var(--hanger-width), 146px);
  height: var(--hanger-depth);
  transform: translateX(-50%);
  transition: left .55s var(--ease), top .55s var(--ease), width .55s var(--ease);
}
.slot.trousers {
  --hanger-depth: 5px;
}
.slot.trousers .hanger {
  height: 5px;
  min-width: 18px;
}
.slot.trousers .hanger::before, .slot.trousers .hanger::after {height: 5px}

/* Keep animated panels inside the modal. Wide tables scroll inside their own frame. */
.detail {
  overflow: hidden;
  grid-template-columns: minmax(0,1fr);
  grid-template-rows: minmax(0,1fr) auto;
  overscroll-behavior-x: none;
}
.detail-scroll {
  position: relative;
  display: flex;
  min-height: 0;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overflow-anchor: none;
  overscroll-behavior: contain;
}
.detail-scroll > .detail-body {flex: none}
.purchase-dock {z-index: 5; min-width: 0; background: #fcfcfb}
.purchase-dock[hidden] {display: none}
.reveal-frame {display: contents}
.measure-note {margin: 0 0 14px;color: #66655f;font-size: 12px;line-height: 1.45}
.purchase .presale-label:disabled {cursor: default; opacity: 1; -webkit-text-fill-color: #fff}
.segmented {position: relative; isolation: isolate}
.segmented button {position: relative; z-index: 1; transition: color .3s}
.segmented.slider-ready button[aria-pressed=true] {background: transparent}
.size-slider {left: 0; top: 0}
.size-options:not(.slider-ready) button[aria-pressed=true] {background: #1c1c1a}
.detail-body, .detail-left, .detail-right {min-width: 0}
.info-pairs {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px 22px;
  margin: 0;
}
.info-pair {
  display: grid;
  grid-template-columns: minmax(4em,auto) minmax(0,1fr);
  align-items: baseline;
  gap: 10px;
  font-size: 14px;
}
.info-pair dt {color: #777; overflow-wrap: anywhere}
.info-pair dd {margin: 0; overflow-wrap: anywhere}
@media (max-width: 760px) {
  .detail-right .data-block {will-change: auto}
  .reveal-frame {display: flow-root; margin-bottom: 32px}
  .reveal-frame > .data-block {margin-bottom: 0}
  .detail.open .detail-right .data-block[data-reveal-pending] {opacity:0}
  body:has(.detail.open) {overscroll-behavior: none}
  .detail {
    overflow-x: hidden;
    overscroll-behavior: none;
    grid-template-columns: minmax(0,1fr);
    overflow-anchor: none;
  }
  .detail-left {overflow: clip; touch-action: pan-y pinch-zoom}
  .detail-art {max-width: 100%}
  .detail-image {touch-action: pan-y pinch-zoom}
  .detail-body {max-width: 100%; overflow-wrap: anywhere}
  .detail-right {overflow: clip}
  .detail.has-purchase .detail-body {padding-bottom: 32px}
  .detail .detail-body:has(.reveal-frame) {padding-bottom: 0}
  .detail-right:has(.reveal-frame) {padding-bottom: 0}
  .detail-right .reveal-frame:not(:has(~ .reveal-frame)) {margin-bottom: 12px}
  .measure-note {display: none}
  .purchase-dock .purchase-block {
    position: static;
    background: transparent;
    backdrop-filter: none;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .table-scroll {max-width: 100%; overscroll-behavior-x: contain}
  .info-pairs {grid-template-columns: minmax(0,1fr)}
  .purchase button {min-width: 0; overflow-wrap: anywhere}
}
@media (prefers-reduced-motion: reduce) {
  .detail.open .detail-right .data-block:not(.purchase-block) {opacity: 1; transform: none}
  .slot .hook, .slot .hook::after, .slot .hanger, .slot.active .hanger {transition: none}
  .slot {transform: translateX(calc(var(--offset)*var(--pitch) + var(--shift,0px)))!important}
}

    const toast=document.querySelector('#toast');toast.textContent='图片暂时没有加载好，请再试一次。';toast.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300);
  });
}
function cancelOrbitIntent(){
  orbitTicket++;orbitDirection=0;stopOrbitFrame();
  clearTimeout(orbitNotice);setOrbitHint('');
}
move=function(direction){orbitMove(direction)};

art.addEventListener('touchstart',event=>{
  if(event.touches.length!==1||items.length<2)return;
  const t=event.touches[0];
  orbitGesture={id:t.identifier,x:t.clientX,y:t.clientY,axis:null,base:orbitPosition,lastTime:event.timeStamp,lastX:t.clientX,speed:0};
},{passive:true});
art.addEventListener('touchmove',event=>{
  const g=orbitGesture,t=event.touches[0];if(!g||!t)return;
  if(event.touches.length!==1){if(g.axis==='x')animateOrbit(orbitCenter,170);orbitGesture=null;return}
  const dx=t.clientX-g.x,dy=t.clientY-g.y;
  if(!g.axis){
    if(Math.abs(dy)>8&&Math.abs(dy)*1.15>=Math.abs(dx))g.axis='y';
    else if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*1.35){g.axis='x';g.base=orbitPosition;cancelOrbitIntent()}
  }
  if(g.axis!=='x')return;
  g.speed=(t.clientX-g.lastX)/Math.max(1,event.timeStamp-g.lastTime);g.lastX=t.clientX;g.lastTime=event.timeStamp;
  if(motionOK()){
    const progress=g.base-orbitCenter-dx/Math.max(130,(orbitWidth||art.clientWidth)*.53);
    orbitPosition=orbitCenter+Math.max(-.88,Math.min(.88,progress));paintOrbit();
  }
},{passive:true});
art.addEventListener('touchend',event=>{
  const g=orbitGesture;if(!g)return;
  const t=Array.from(event.changedTouches).find(t=>t.identifier===g.id);if(!t)return;
  orbitGesture=null;if(g.axis!=='x')return;
  suppressTapUntil=performance.now()+400;
  const dx=t.clientX-g.x,progress=orbitPosition-orbitCenter;
  const flick=event.timeStamp-g.lastTime<85&&Math.abs(dx)>27&&Math.abs(g.speed)>.45&&Math.sign(dx)===Math.sign(g.speed);
  if(Math.abs(progress)>.28)orbitMove(Math.sign(progress));
  else if(flick||!motionOK()&&Math.abs(dx)>55)orbitMove(dx<0?1:-1);
  else animateOrbit(orbitCenter,170);
},{passive:true});
art.addEventListener('touchcancel',()=>{const g=orbitGesture;orbitGesture=null;if(g?.axis==='x')animateOrbit(orbitCenter,170)},{passive:true});

const supportDialog = element('dialog', 'support-dialog');
supportDialog.setAttribute('aria-label', '联系客服');
const supportClose = element('button', 'support-close', '关闭 ×');
const supportLink = element('a', '', '前往原展厅');
supportDialog.append(supportClose, element('h2', '', '联系客服'),
  element('p', 'support-intro', '请在原展厅留言和查看回复。'), supportLink);
document.body.append(supportDialog);
supportClose.onclick = () => supportDialog.close();
supportDialog.onkeydown = event => event.stopPropagation();
function openSupport(product) {
  const item = product ?? (opened ? items[current] : null);
  supportLink.href = originalShowroom + (item ? "#piece-" + encodeURIComponent(item.id) : "");
  if (!supportDialog.open) supportDialog.showModal();
}
function supportButton(){
  const button=element('button','support-entry','客服');
  button.type='button';
  button.onclick=()=>openSupport();
  return button;
}
home.querySelector('.tools').append(supportButton());
const detailSupport=supportButton();
detailSupport.classList.add('detail-support');
detail.append(detailSupport);

{
  const position = element('span','rack-position');
  const track = element('span','rack-position-track');
  const thumb = element('span','');
  const slider = element('input','');
  slider.type = 'range';
  slider.min = '0';
  slider.max = '1000';
  slider.value = '0';
  slider.disabled = true;
  slider.setAttribute('aria-label','衣架滑动位置');
  track.setAttribute('aria-hidden','true');
  track.append(thumb);
  position.append(track,slider);
  home.querySelector('.hint').append(position);

  let hidePositionTimer;
  function hidePosition(){
    clearTimeout(hidePositionTimer);
    position.classList.remove('visible','dragging');
    rackScroll.classList.remove('rack-position-drag');
    slider.disabled = true;
  }
  function showPosition(){
    const available = rackScroll.scrollWidth-rackScroll.clientWidth;
    if(opened||available<2){hidePosition();return}
    const progress = Math.max(0,Math.min(1,rackScroll.scrollLeft/available));
    const thumbWidth = rackScroll.clientWidth/rackScroll.scrollWidth;
    slider.disabled = false;
    slider.value = String(Math.round(progress*1000));
    thumb.style.width = thumbWidth*100+'%';
    thumb.style.transform = 'translateX('+progress*(1/thumbWidth-1)*100+'%)';
    position.classList.add('visible');
    clearTimeout(hidePositionTimer);
    if(!position.classList.contains('dragging')&&document.activeElement!==slider){
      hidePositionTimer = setTimeout(hidePosition,500);
    }
  }
  slider.addEventListener('input',()=>{
    activate(-1);
    rackScroll.scrollLeft = Number(slider.value)/1000*(rackScroll.scrollWidth-rackScroll.clientWidth);
    showPosition();
  });
  slider.addEventListener('pointerdown',()=>{
    position.classList.add('dragging');
    rackScroll.classList.add('rack-position-drag');
  });
  slider.addEventListener('blur',showPosition);
  for(const name of ['pointerup','pointercancel']){
    window.addEventListener(name,()=>{
      if(position.classList.contains('dragging')){
        position.classList.remove('dragging');
        rackScroll.classList.remove('rack-position-drag');
        slider.blur();
        showPosition();
      }
    });
  }

  let openingTransfer;
  function stopRackTransfer(){
    if(!openingTransfer)return;
    const {photo,animation}=openingTransfer;
    openingTransfer=null;
    animation.cancel();
    photo.remove();
    detail.classList.remove('rack-transfer-open');
  }
  rackScroll.addEventListener('scroll',showPosition,{passive:true});
  rackScroll.addEventListener('pointerdown',stopRackTransfer,{passive:true});
  rackScroll.addEventListener('wheel',stopRackTransfer,{passive:true});

  function loadedPhoto(image){
    return image?.complete&&image.naturalWidth>0&&image.currentSrc;
  }
  function usableBounds(bounds){
    return bounds&&Math.min(bounds.width,bounds.height)>10;
  }
  function fittedBounds(image,box){
    if(!image?.naturalWidth||!usableBounds(box))return null;
    const fit=Math.min(box.width/image.naturalWidth,box.height/image.naturalHeight);
    const width=image.naturalWidth*fit,height=image.naturalHeight*fit;
    return {left:box.left+(box.width-width)/2,top:box.top+(box.height-height)/2,width,height};
  }
  function movePhotoIntoDetail(source,from,to){
    const photo=new Image();
    photo.alt="";
    photo.className="rack-transfer-photo";
    photo.setAttribute("aria-hidden","true");
    photo.src=source;
    Object.assign(photo.style,{position:"fixed",left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",objectFit:"contain",transformOrigin:"center top",zIndex:42,pointerEvents:"none"});
    document.body.append(photo);
    const x=to.left+to.width/2-from.left-from.width/2,y=to.top-from.top,scale=to.height/from.height;
    const animation=photo.animate([
      {transform:"translate(0px,0px) scale(1)"},
      {transform:"translate("+x+"px,"+y+"px) scale("+scale+")"},
    ],{duration:350,easing:"cubic-bezier(.2,.75,.25,1)",fill:"both"});
    openingTransfer={photo,animation};
    animation.onfinish=()=>{if(openingTransfer?.animation===animation)stopRackTransfer();};
  }

  const openRackDetails=openDetail;
  openDetail=function(index,push=true){
    hidePosition();
    finishRackReturn();
    stopRackTransfer();
    const entering=!opened&&motionOK();
    const returning=retainedAngle?.index===index&&retainedAngle.slot.isConnected?retainedAngle:null;
    const activeSlot=rack.querySelector(".slot.active");
    const origin=entering?(returning?.photo||(Number(activeSlot?.dataset.index)===index?activeSlot.querySelector(".view.front"):null)):null;
    const source=loadedPhoto(origin);
    const from=source?fittedBounds(origin,origin.getBoundingClientRect()):null;
    if(usableBounds(from))detail.classList.add("rack-transfer-open");
    retainedOpenAngle=returning?.angle;
    clearRetainedAngle();
    openRackDetails(index,push);
    retainedOpenAngle=null;
    if(!entering||!opened||!usableBounds(from)){detail.classList.remove("rack-transfer-open");return;}
    const to=fittedBounds(origin,document.querySelector("#detailImage").getBoundingClientRect());
    if(usableBounds(to))movePhotoIntoDetail(source,from,to);
    else detail.classList.remove("rack-transfer-open");
  };

  let retainedAngle, rackReturn, restoringRack=false, retainedOpenAngle;
  const activateRack=activate;
  const renderRackDetail=render;
  render=function(angle){
    const restored=retainedOpenAngle;
    retainedOpenAngle=null;
    return renderRackDetail(angle||restored);
  };

  function placeRetainedPhoto(state){
    state.photo.removeAttribute('style');
    state.photo.className='rack-retained-photo';
    state.slot.querySelector('.views').append(state.photo);
  }
  function finishRackReturn(){
    if(!rackReturn)return;
    const state=rackReturn;
    rackReturn=null;
    if(state===retainedAngle){
      placeRetainedPhoto(state);
    }
    state.animations.forEach(animation=>animation.cancel());
    detail.classList.remove('returning-to-rack','returning-photo-outside-detail');
    home.classList.remove('returning-rack-clearing');
  }
  function clearRetainedAngle(){
    if(!retainedAngle)return;
    finishRackReturn();
    const state=retainedAngle;
    retainedAngle=null;
    state.photo.remove();
    state.slot.classList.remove('retained-angle');
    state.slot.removeAttribute('data-return-angle');
  }
  activate=function(index){
    if(retainedAngle&&!retainedAngle.slot.isConnected)clearRetainedAngle();
    if(retainedAngle&&!opened){
      if(restoringRack||index<0)return;
      if(index!==retainedAngle.index)clearRetainedAngle();
    }
    return activateRack(index);
  };
  function resumeBrowsing(){
    if(!opened&&retainedAngle){clearRetainedAngle();activateRack(-1);}
  }
  const scrollBrowsing=scrollRack;
  scrollRack=function(direction){resumeBrowsing();return scrollBrowsing(direction);};
  slider.addEventListener('input',resumeBrowsing);
  rackScroll.addEventListener('wheel',resumeBrowsing,{passive:true});
  let rackTouch;
  rackScroll.addEventListener('touchstart',event=>{
    rackTouch=event.touches.length===1?event.touches[0]:null;
  },{passive:true});
  rackScroll.addEventListener('touchmove',event=>{
    if(!rackTouch||event.touches.length!==1)return;
    const touch=event.touches[0];
    const x=Math.abs(touch.clientX-rackTouch.clientX);
    const y=Math.abs(touch.clientY-rackTouch.clientY);
    if(x>9&&x>y*1.25){rackTouch=null;resumeBrowsing();}
  },{passive:true});
  rackScroll.addEventListener('keydown',event=>{
    if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key))resumeBrowsing();
  });

  function bringSlotIntoView(slot){
    const scroll=rackScroll.getBoundingClientRect();
    const picture=slot.querySelector('.views').getBoundingClientRect();
    const center=picture.left+picture.width/2;
    if(center<scroll.left+36||center>scroll.right-36){
      rackScroll.scrollLeft+=center-(scroll.left+scroll.width/2);
    }
  }
  function movePhotoToRack(state,from,to){
    const photo=state.photo;
    photo.className='rack-transfer-photo';
    const x=to.left+to.width/2-from.left-from.width/2;
    const y=to.top-from.top, scale=to.height/from.height;
    Object.assign(photo.style,{
      position:'fixed',left:from.left+'px',top:from.top+'px',width:from.width+'px',
      height:from.height+'px',objectFit:'contain',transformOrigin:'center top',zIndex:42,pointerEvents:'none',
    });
    document.body.append(photo);
    return photo.animate([
      {transform:'translate(0px,0px) scale(1)'},
      {transform:'translate('+x+'px,'+y+'px) scale('+scale+')'},
    ],{duration:310,easing:'cubic-bezier(.22,.70,.28,1)',fill:'both'});
  }

  const closeRackDetails=closeDetail;
  closeDetail=function(fromHistory=false){
    if(!opened)return;
    const image=document.querySelector('#detailImage');
    const moving=openingTransfer?.photo||image;
    const source=loadedPhoto(image);
    const from=source&&moving?fittedBounds(image,moving.getBoundingClientRect()):null;
    const rail=detailScroll.getBoundingClientRect();
    const visibleHeight=from?Math.max(0,Math.min(from.top+from.height,rail.bottom)-Math.max(from.top,rail.top)):0;
    const slot=rack.querySelector('.slot[data-index="'+current+'"]');
    stopRackTransfer();
    if(!slot||!source){closeRackDetails(fromHistory);return;}

    const replacement=image.cloneNode(false);
    image.replaceWith(replacement);
    image.removeAttribute('id');
    image.removeAttribute('style');
    const state={index:current,photo:image,angle:view,slot,animations:[]};
    retainedAngle=state;
    slot.classList.add('retained-angle');
    slot.dataset.returnAngle=view;

    home.classList.add('returning-rack-aligning');
    activateRack(current);
    bringSlotIntoView(slot);
    const to=fittedBounds(image,slot.querySelector('.views').getBoundingClientRect());
    const flies=motionOK()&&to&&usableBounds(from)&&visibleHeight/from.height>=.60;
    if(motionOK()){
      detail.classList.add('returning-to-rack');
      home.classList.add('returning-rack-clearing');
      if(from&&visibleHeight>0)detail.classList.add('returning-photo-outside-detail');
    }
    restoringRack=true;
    try{
      closeRackDetails(fromHistory);
      slot.querySelector('.piece').focus({preventScroll:true});
    }finally{restoringRack=false;home.classList.remove('returning-rack-aligning');}

    if(!motionOK()){
      placeRetainedPhoto(state);
      return;
    }
    rackReturn=state;
    const panel=detail.animate([{opacity:1},{opacity:0}],{
      duration:flies?200:220,easing:'ease-out',fill:'both',
    });
    state.animations.push(panel);
    const mover=flies?movePhotoToRack(state,from,to):null;
    if(mover)state.animations.push(mover);
    const last=mover||panel;
    last.onfinish=()=>{if(rackReturn===state)finishRackReturn();};
  };
  matchMedia('(prefers-reduced-motion:reduce)').addEventListener?.('change',()=>{stopRackTransfer();finishRackReturn();});
}

prepare();
